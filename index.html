<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microsoft Roadmaps & Releases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MS News" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png" />

  <!-- Theme colour (Android Chrome + Safari tab bar) -->
  <meta name="theme-color" content="#0078d4" />

  <link rel="stylesheet" href="style.css?v=20260526e" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">Microsoft Roadmaps & Releases</span>
      </div>
      <div class="header-controls">
        <span class="updated-label" id="updatedLabel"></span>
        <div class="date-picker-wrap">
          <label for="datePicker" class="sr-only">Datum auswählen</label>
          <select id="datePicker" class="date-picker" aria-label="Datum auswählen"></select>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Roadmap areas">
    <button class="tab active" role="tab" aria-selected="true"  data-tab="summary"       aria-controls="panel-summary">This Month</button>
    <button class="tab"        role="tab" aria-selected="false" data-tab="releasenotes"  aria-controls="panel-releasenotes">Release Notes</button>
    <button class="tab"        role="tab" aria-selected="false" data-tab="fabricroadmap" aria-controls="panel-fabricroadmap">Fabric Roadmap</button>
    <button class="tab"        role="tab" aria-selected="false" data-tab="copilot"       aria-controls="panel-copilot">Microsoft Copilot</button>
    <button class="tab"        role="tab" aria-selected="false" data-tab="agents"        aria-controls="panel-agents">Microsoft Agents</button>
    <button class="tab"        role="tab" aria-selected="false" data-tab="saved"         aria-controls="panel-saved">Gespeichert</button>
  </nav>

  <main>
    <div id="panel-summary"       class="tab-panel active" role="tabpanel"></div>
    <div id="panel-releasenotes"  class="tab-panel"        role="tabpanel"></div>
    <div id="panel-fabricroadmap" class="tab-panel"        role="tabpanel"></div>
    <div id="panel-copilot"       class="tab-panel"        role="tabpanel"></div>
    <div id="panel-agents"        class="tab-panel"        role="tabpanel"></div>
    <div id="panel-saved"         class="tab-panel"        role="tabpanel"></div>
    <div id="errorBox"        class="error-box hidden"></div>
    <div id="loadingSpinner"  class="spinner hidden" aria-live="polite" aria-label="Wird geladen…">
      <span class="spinner-ring"></span>
    </div>
  </main>

  <footer>
    <span>Data from public Microsoft RSS feeds · Hosted on GitHub Pages · Internal tool · Not a public offering</span>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="Scroll to top">↑</button>
  <script src="app.js?v=20260526e"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('SW registration failed:', err))
      );
    }
  </script>
</body>
</html>
