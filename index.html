<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover enables env(safe-area-inset-*) for iPhone X notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Microsoft Roadmaps & Releases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MS News" />

  <!-- Apple Touch Icons (v2 filenames force iOS cache refresh) -->
  <link rel="apple-touch-icon"             href="icons/apple-touch-icon-v2.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v2.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167-v2.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152-v2.png" />

  <!-- Theme colour -->
  <meta name="theme-color" content="#0078d4" />

  <link rel="stylesheet" href="style.css?v=20260526f" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">Microsoft Roadmaps & Releases</span>
      </div>
      <div class="header-controls">
        <span class="updated-label" id="updatedLabel"></span>

        <!-- Desktop: normal date select -->
        <div class="date-picker-wrap">
          <label for="datePicker" class="sr-only">Datum auswählen</label>
          <select id="datePicker" class="date-picker" aria-label="Datum auswählen"></select>
        </div>

        <!-- Mobile only: calendar icon button that opens the bottom sheet -->
        <button class="date-toggle-btn" id="dateToggleBtn"
                aria-label="Select date" aria-expanded="false" aria-controls="dateSheet">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"
               xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x=".75" y="2" width="13.5" height="12.25" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <line x1=".75" y1="6" x2="14.25" y2="6" stroke="currentColor" stroke-width="1.4"/>
            <line x1="4.75" y1=".75" x2="4.75" y2="3.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="10.25" y1=".75" x2="10.25" y2="3.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span id="dateToggleLabel">Date</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Tabs: data-icon / data-short drive the mobile bottom nav icons & labels -->
  <nav class="tabs" role="tablist" aria-label="Roadmap areas">
    <button class="tab active" role="tab" aria-selected="true"
            data-tab="summary"       data-icon="◉" data-short="Month"
            aria-controls="panel-summary">This Month</button>
    <button class="tab"        role="tab" aria-selected="false"
            data-tab="releasenotes"  data-icon="◆" data-short="Releases"
            aria-controls="panel-releasenotes">Release Notes</button>
    <button class="tab"        role="tab" aria-selected="false"
            data-tab="fabricroadmap" data-icon="◈" data-short="Fabric"
            aria-controls="panel-fabricroadmap">Fabric Roadmap</button>
    <button class="tab"        role="tab" aria-selected="false"
            data-tab="copilot"       data-icon="⊕" data-short="Copilot"
            aria-controls="panel-copilot">Microsoft Copilot</button>
    <button class="tab"        role="tab" aria-selected="false"
            data-tab="agents"        data-icon="⚙" data-short="Agents"
            aria-controls="panel-agents">Microsoft Agents</button>
    <button class="tab"        role="tab" aria-selected="false"
            data-tab="saved"         data-icon="★" data-short="Saved"
            aria-controls="panel-saved">Gespeichert</button>
  </nav>

  <main>
    <div id="panel-summary"       class="tab-panel active" role="tabpanel"></div>
    <div id="panel-releasenotes"  class="tab-panel"        role="tabpanel"></div>
    <div id="panel-fabricroadmap" class="tab-panel"        role="tabpanel"></div>
    <div id="panel-copilot"       class="tab-panel"        role="tabpanel"></div>
    <div id="panel-agents"        class="tab-panel"        role="tabpanel"></div>
    <div id="panel-saved"         class="tab-panel"        role="tabpanel"></div>
    <div id="errorBox"       class="error-box hidden"></div>
    <div id="loadingSpinner" class="spinner hidden" aria-live="polite" aria-label="Wird geladen…">
      <span class="spinner-ring"></span>
    </div>
  </main>

  <footer>
    <span>Data from public Microsoft RSS feeds · Hosted on GitHub Pages · Internal tool</span>
  </footer>

  <!-- Mobile date picker bottom sheet -->
  <div id="dateSheet" class="date-sheet" role="dialog" aria-modal="true" aria-label="Select date">
    <div class="date-sheet-backdrop" id="dateSheetBackdrop"></div>
    <div class="date-sheet-panel">
      <div class="date-sheet-handle"></div>
      <p class="date-sheet-title">Select Date</p>
      <div id="dateSheetBody" class="date-sheet-body"></div>
    </div>
  </div>

  <button id="backToTop" class="back-to-top" aria-label="Scroll to top">↑</button>
  <script src="app.js?v=20260526f"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('SW registration failed:', err))
      );
    }
  </script>
</body>
</html>
